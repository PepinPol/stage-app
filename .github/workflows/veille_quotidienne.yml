name: Agent de Veille Stage PM/PO

on:
  schedule:
    # S'exécute uniquement du lundi au vendredi (1-5) à 07h00 UTC (08h00 Paris)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-veille:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt

      - name: Lancer l'agent de recherche
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
          GSHEETS_CREDENTIALS_JSON: ${{ secrets.GSHEETS_CREDENTIALS_JSON }}
        run: |
          python agent_veille.py
